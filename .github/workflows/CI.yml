name: CI
on:
  workflow_dispatch:
jobs:
  windows-loading:
    name: Julia ${{ matrix.version }} - windows-2025 - x64
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
          - lts
    defaults:
      run:
        shell: bash
    steps:
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - name: Add MLX_jll and its dependencies
        timeout-minutes: 10
        run: |
          julia --project=mlx_jll --color=yes -e '
              using Pkg
              Pkg.add(name = "MLX_jll", version = "0.25.1")
              project_file = joinpath(dirname(dirname(Base.find_package("MLX_jll"))), "Project.toml")
              deps = setdiff(keys(Pkg.Types.read_project(project_file).deps), ["Artifacts", "JLLWrappers", "Libdl", "Pkg", "LazyArtifacts"])
              Pkg.add(collect(deps))'
      - name: Load MLX_jll, then terminate without unloading (TerminateProcess)
        timeout-minutes: 2
        continue-on-error: true
        run: |
          julia --project=mlx_jll --color=yes -e '
              using MLX_jll
              println("Loaded MLX_jll, terminating"); flush(stdout)
              process = ccall((:GetCurrentProcess, "kernel32"), stdcall, Ptr{Cvoid}, ())
              ccall((:TerminateProcess, "kernel32"), stdcall, Cint, (Ptr{Cvoid}, Cuint), process, 0)'
      - name: Load MLX_jll, unload libmlx (dlclose), then exit
        timeout-minutes: 2
        run: |
          julia --project=mlx_jll --color=yes -e '
              using Libdl, MLX_jll
              println("Loaded MLX_jll, unloading libmlx"); flush(stdout)
              println("dlclose: ", Libdl.dlclose(MLX_jll.libmlx_handle)); flush(stdout)
              println("Unloaded libmlx, exiting"); flush(stdout)
              exit(0)'
