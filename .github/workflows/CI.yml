name: CI
on:
  workflow_dispatch:
jobs:
  windows-loading:
    name: Julia ${{ matrix.version }} - windows-2025 - x64
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
          - lts
    defaults:
      run:
        shell: bash
    steps:
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - name: Add MLX_jll and its dependencies
        timeout-minutes: 10
        run: |
          julia --project=mlx_jll --color=yes -e '
              using Pkg
              Pkg.add(name = "MLX_jll", version = "0.23.2")
              project_file = joinpath(dirname(dirname(Base.find_package("MLX_jll"))), "Project.toml")
              deps = setdiff(keys(Pkg.Types.read_project(project_file).deps), ["Artifacts", "JLLWrappers", "Libdl", "Pkg", "LazyArtifacts"])
              Pkg.add(collect(deps))'
      - name: Load MLX_jll, then exit without unloading (_exit)
        timeout-minutes: 2
        continue-on-error: true
        run: |
          julia --project=mlx_jll --color=yes -e '
              using MLX_jll
              println("Loaded MLX_jll, exiting with _exit"); flush(stdout)
              ccall(:_exit, Cvoid, (Cint,), 0)'
      - name: Load MLX_jll, then exit normally (exit)
        timeout-minutes: 2
        run: |
          julia --project=mlx_jll --color=yes -e '
              using MLX_jll
              println("Loaded MLX_jll, exiting with exit"); flush(stdout)
              exit(0)'
